services:
  mosquitto:
    build: ./mqtt
    restart: unless-stopped
    environment:
      MQTT_LAN_HOST: ${MQTT_LAN_HOST:-127.0.0.1}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Defina MQTT_BACKEND_PASSWORD no arquivo .env}
      ESP32_TERMINAL_ID: ${ESP32_TERMINAL_ID:-}
      MQTT_ESP32_PASSWORD: ${MQTT_ESP32_PASSWORD:-}
      MQTT_SIMULATOR_TERMINAL_ID: ${MQTT_SIMULATOR_TERMINAL_ID:-}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-}
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-8883}:8883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_ca:/mqtt-ca
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h mosquitto -p 8883 --cafile /mqtt-ca/ca.crt -u backend -P \"$$MQTT_BACKEND_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-access_control}
      POSTGRES_USER: ${POSTGRES_USER:-access_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - access_control_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  face-recognition:
    build:
      context: ./face-recognition
    restart: unless-stopped
    # O comando do healthcheck vem do Dockerfile.
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3333"
      DATABASE_URL: postgresql://${POSTGRES_USER:-access_control}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-access_control}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      MAX_PHOTO_BYTES: ${MAX_PHOTO_BYTES:-102400}
      FACE_RECOGNITION_URL: http://face-recognition:8000
      FACE_RECOGNITION_TIMEOUT_MS: ${FACE_RECOGNITION_TIMEOUT_MS:-5000}
      ESP32_TERMINAL_ID: ${ESP32_TERMINAL_ID:-}
      MQTT_SIMULATOR_TERMINAL_ID: ${MQTT_SIMULATOR_TERMINAL_ID:-}
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_CA_FILE: /mqtt-ca/ca.crt
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Defina MQTT_BACKEND_PASSWORD no arquivo .env}
      PHOTOS_DIR: /app/uploads
    ports:
      - "3333:3333"
    volumes:
      - access_control_photos:/app/uploads
      - mqtt_ca:/mqtt-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:80"
    depends_on:
      backend:
        condition: service_healthy

  simulator:
    profiles: [simulacao]
    build: ./backend
    healthcheck:
      disable: true
    command: ["./node_modules/.bin/tsx", "src/scripts/mqtt-simulator.ts"]
    environment:
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_CA_FILE: /mqtt-ca/ca.crt
      MQTT_SIMULATOR_TERMINAL_ID: ${MQTT_SIMULATOR_TERMINAL_ID:-}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-}
    volumes:
      - mqtt_ca:/mqtt-ca:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mqtt_data:
  mqtt_ca:
  access_control_pgdata:
    name: access_control_pgdata
  access_control_photos:
    name: access_control_photos
