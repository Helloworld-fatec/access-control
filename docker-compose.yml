# Sobe o sistema completo: banco + backend + frontend.
#   1) cp .env.docker.example .env        (e PREENCHA POSTGRES_PASSWORD e JWT_SECRET: não há valor padrão)
#   2) docker compose up --build -d
#   3) docker compose ps                  (os três serviços devem ficar "healthy")
# Front: http://localhost:8080   |   API direta (apps e terminais): http://localhost:3000/api
# Se algo falhar: docker compose logs --tail=100 <db|backend|frontend>  (veja docs/como-rodar.md)
#
# Os segredos vêm só do arquivo .env (que o Git ignora). Nada sensível está escrito neste arquivo.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # os logs não crescem sem limite
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (use só letras e números)}
      POSTGRES_DB: ${POSTGRES_DB:-access_control}
    volumes:
      - access_control_pgdata:/var/lib/postgresql/data
    # O banco NÃO publica porta no computador: só os outros serviços do Compose o alcançam.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-access_control}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (mínimo 32 caracteres)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - access_control_photos:/app/photos
    # Só fica "healthy" depois que as migrações rodaram e a API respondeu.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # Confere a página e também o caminho Nginx -> backend (/api).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ && wget -q --spider http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *logging

volumes:
  access_control_pgdata:
  access_control_photos:
