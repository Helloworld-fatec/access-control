# Nginx do frontend: serve a build do React e encaminha /api para o backend.
# Como o navegador só fala com este servidor, não há CORS e o front usa "/api" (US-17).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fotos de usuários podem chegar a alguns MB.
  client_max_body_size 8m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Permite trocar o endereço da API sem refazer a build.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # Arquivos com hash no nome podem ser guardados por muito tempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rotas do React Router (/painel, /usuarios/123...) voltam para o index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
