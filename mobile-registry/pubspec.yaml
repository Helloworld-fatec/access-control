name: mobile_registry
description: App do administrador (usuários, tags NFC e rosto) do Sistema Integrado de Controle de Acesso.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  dio: ^5.7.0
  go_router: ^18.1.1
  shared_preferences: ^2.3.4
  # Token de acesso guardado no Keystore do Android (US-04). Mesma versão do mobile-readings.
  flutter_secure_storage: ^9.2.2
  # Leitura de tag NFC (US-11). Mesma versão e API do mobile-readings.
  nfc_manager: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
