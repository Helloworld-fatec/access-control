name: mobile-user CI

on:
  pull_request:
    branches:
      - stage
      - main
      # - develop # habilitar quando a branch entrar no fluxo
    paths:
      - "mobile-user/mobileuser/**"
      - ".github/workflows/mobile-user-ci-cd.yml"

permissions:
  contents: read

concurrency:
  group: mobile-user-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-user/mobileuser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build apk --debug
      - name: Salvar APK por 14 dias
        if: github.base_ref == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-user-apk-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: mobile-user/mobileuser/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

