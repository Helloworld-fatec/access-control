name: mobile-registry CI

on:
  push:
    paths: ["mobile-registry/**", ".github/workflows/mobile-registry-ci.yml"]
  pull_request:
    paths: ["mobile-registry/**", ".github/workflows/mobile-registry-ci.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: flutter build apk --debug
