name: Frontend lint

on:
  pull_request:
    branches:
      - stage
      - main
      # - develop # habilitar quando a branch entrar no fluxo
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # O deploy do frontend é automático pela Cloudflare, conforme a branch
      # configurada no projeto Cloudflare; este workflow só executa o lint.
